name: Aqlan Dental Lab CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: chmod +x gradlew || true

      - name: Run Code Lint & Static Analysis
        run: |
          ./gradlew lintDebug || gradle lintDebug

      - name: Compile Applet & Assemble Debug
        run: |
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Run Unit & Security Regression Tests
        run: |
          ./gradlew testDebugUnitTest --continue || gradle testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7
